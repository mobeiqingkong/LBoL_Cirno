    Each time {PlayerName} plays a green card, apply {Value1} |Nature's Demise| to a random enemy.
  Brief: |-
    Each time {PlayerName} plays a green card, apply {Value1} |Nature's Demise| to a random enemy.

CirnoRCharacterFairyFlowerSe:
