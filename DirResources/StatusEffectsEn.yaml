  Description: |-
    At the end of {PlayerName}'s turn, gain {Value1} |Barrier| and recover {Value2} life.
  Brief: |-
    At the end of {PlayerName}'s turn, gain {Value1} |Barrier| and recover {Value2} life.

CirnoRCharacterSymbioticRootSe:
