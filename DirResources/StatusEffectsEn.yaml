CirnoRCharacterFrostEtchingImprintSe:
  Name: Extreme Frost
  Description: After playing a blue card, apply |Frost| {Value1} time{Value1:plural one='' other='s'} to a random enemy.
  Brief: After playing a blue card, apply |Frost| {Value1} time{Value1:plural one='' other='s'} to a random enemy.

CirnoRCharacterFrostflowSe:
  Name: Frostflow
  Description: At the start of each turn, {PlayerName} gains {CirnoRCharacterFrostValue} |Frost Condensation|.
  Brief: At the start of each turn, {PlayerName} gains {CirnoRCharacterFrostValue} |Frost Condensation|.

CirnoRCharacterFrostCondensationSe:
  Name: Frost Condensation
  Description: |-
    Each time damage is dealt to an enemy, lose 1 stack and apply |Frost| to the target enemy.
  Brief: |-
    Each time damage is dealt to an enemy, lose 1 stack and apply |Frost| to the target enemy.

CirnoRCharacterFrostSe:
  Name: Frost
  Description: |-
    At the start of {OwnerName}'s turn, gain {TempFirepowerNegativeValue} |Temporary Firepower Down|, then remove |Frost|.
    When |Frost| is applied again, take {BaseDamage} damage and apply |Frostbite|.
  Brief: |-
    At the start of {OwnerName}'s turn, gain |Temporary Firepower Down|, then remove |Frost|.
    When |Frost| is applied again, take damage and apply |Frostbite|.

CirnoRCharacterFrozenHexagramSe:
  Name: Frozen Hexagram Crystal
  Description: After playing a blue card, {PlayerName} gains {TempFirepowerValue} |Temporary Firepower| and {ShieldValue} |Barrier|, lose 1 stack at the end of each turn.
  Brief: After playing a blue card, {PlayerName} gains |Temporary Firepower| and |Barrier|, lose 1 stack at the end of each turn.

CirnoRCharacterFrozenHexagramShieldSe:
  Name: Frozen Hexagram Shield
  Description: |-
    At the end of {PlayerName}'s turn, gain {ShieldValue} |Barrier|, and {PlayerName} gains {LockedOnValue} |Lock On|.
  Brief: |-
    At the end of {PlayerName}'s turn, gain |Barrier|, and {PlayerName} gains |Lock On|.

CirnoRCharacterNaturalGrowthSe:
  Name: Natural Growth
  Description: |-
    For every {Value1} {Mana} spent, add a |Fairy Flower| to the hand.
  Brief: |-
    For every {Value1} {Mana} spent, add a |Fairy Flower| to the hand.

CirnoRCharacterElfFlowerFieldSe:
  Name: Midsummer Blossom
  Description: |-
    At the start of each {PlayerName}'s turn, gain {Mana}.
    At the start of each {PlayerName}'s turn, add {TempCirnoRCharacterFairyFlowerValue} |Fairy Flower| to the hand.
  Brief: |-
    At the start of each {PlayerName}'s turn, gain {Mana}.
    At the start of each {PlayerName}'s turn, add {TempCirnoRCharacterFairyFlowerValue} |Fairy Flowers| to the hand.

CirnoRCharacterDaiyouseiBlessSe:
  Name: Daiyousei's Blessing
  Description: |-
    Each time {PlayerName} plays a green card, gain {TempFirepowerValue} |Temporary Firepower|.
  Brief: |-
    Each time {PlayerName} plays a green card, gain {TempFirepowerValue} |Temporary Firepower|.

CirnoRCharacterGuardianOfDaiyouseiSe:
  Name: Daiyousei's Protection
  Description: |-
    At the end of each {PlayerName}'s turn, gain {TempCirnoRCharacterGuardianOfNatureSeValue} |Nature's Protection|.
  Brief: |-
    At the end of each {PlayerName}'s turn, gain {TempCirnoRCharacterGuardianOfNatureSeValue} |Nature's Protection|.

CirnoRCharacterGuardianOfNatureSe:
  Name: Nature's Protection
  Description: |-
    Each time damage is taken from an enemy source, lose 1 stack, and apply {Value1} |Nature's Demise| to the damage source.
  Brief: |-
    Each time damage is taken from an enemy source, lose 1 stack, and apply {Value1} |Nature's Demise| to the damage source.

CirnoRCharacterDeathOfNatureSe:
  Name: Nature's Demise
  Description: |-
    At the end of their turn, or when {PlayerName} performs a heal, a character with this imprint loses {loseHpValue} life. If the enemy has |Frostbite|, lose an additional {loseHpValueForFrost} life.
    |Nature's Demise| cannot be removed.
  Brief: |-
    At the end of their turn, or when {PlayerName} performs a heal, a character with this imprint loses {loseHpValue} life. If the enemy has |Frostbite|, lose an additional {loseHpValueForFrost} life.
    |Nature's Demise| cannot be removed.

CirnoRCharacterEntangledRootsSe:
