  Name: Nature's Domain
  Description: |-
    At the end of each {PlayerName}'s turn, lose 1 stack, apply {Value1} |Nature's Demise| to all enemies.
  Brief: |-
    At the end of each {PlayerName}'s turn, lose 1 stack, apply {Value1} |Nature's Demise| to all enemies.

CirnoRCharacterFairyFeatherSe:
