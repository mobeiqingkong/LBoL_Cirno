  Brief: |-
    Each time a blue card is played, draw a card; each time a green card is played, gain <sprite="ManaSprite" name="P">. (Cumulative draws and mana gains cannot exceed {limitValue} time{limitValue:plural one='' other='s'}, {leftValue} left). Removed at the end of the turn.

