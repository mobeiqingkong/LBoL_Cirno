CirnoRCharacterExhibitA:
  Name: 서리심장
  Description: |-
    기본 마나를 {Mana} 제공합니다. |얼음의 용사 치르노|의 전용 카드를 카드 풀에 추가합니다.
    전투 시작 시 |극한의 혹한|을 {Value1} 얻습니다.
  FlavorText: |-
    안개의 호수에서 자연스럽게 형성된 하트 모양의 얼음 결정. 얼음의 영웅과 고향을 잇는 유대를 상징한다. 호수 바닥의 영구한 냉기를 품고 있어, 치르노의 빙결의 힘은 밀물과 썰물처럼 흐른다.
    「최강의 요정이 지키고 있으니까 아무도 안개의 호수를 괴롭힐 수 없어! 이 얼음 심장에는 호수 전체의 겨울이 담겨 있다구! 나쁜 녀석이 오면 전부 얼려버릴 거야! …어? 지금 감동해서 떨고 있는 거지? 절대 이 심장이 너무 차가워서 그런 건 아니야!」

CirnoRCharacterExhibitB:
  Name: 대요정의 가호가 담긴 화관
  Description: |-
    기본 마나를 {Mana} 제공합니다. |얼음의 용사 치르노|의 전용 카드를 카드 풀에 추가합니다.
    전투 시작 시 {PlayerName}가 |대요정의 가호|를 {Value1} 얻고 |자연 성장|을 {Value1} 얻습니다.
  FlavorText: |-
    아침 정원에서 대요정이 정성스럽게 엮은 화관. 꽃잎 하나하나에 순수한 자연의 마력과 부드러운 축복이 스며 있다. 단순한 우정의 상징을 넘어, 치르노의 여정을 묵묵히 떠받치는 ‘조용한 응원’을 힘으로 엮어 넣었다.
    「치르노는 항상 제일 먼저 앞으로 나가니까… 이 화관이 우리 마음이 네 발걸음을 따라잡게 해 줄 거야. 몰래 내 축복도 잔뜩 담아 두었어. 분명 전투가 훨씬 쉬워질 거야!」