CirnoRCharacterExhibitA:
  Name: 冰霜之心
  Description: |-
    提供基礎法力{Mana}。將|冰之勇者-琪露諾|專屬卡牌加入卡池。
    每場戰鬥的第一個回合開始時，獲得{Value1}層|極度霜寒|。
  FlavorText: |-
    霧之湖的冰晶自然凝結成的心臟形態，是冰之勇者與故鄉羈絆的象征。其中蘊含著湖底不化的寒意，讓琪露諾的凍結之力如潮汐般循環不息。
    「有本最強妖精守護，霧之湖就不會被欺負！這塊冰心裏裝著整個湖的冬天，壞蛋來多少就凍住多少！……餵，你感動得發抖了嗎？絕對不是因為這顆心太冷了！」

CirnoRCharacterExhibitB:
  Name: 大妖精的祝福花環
  Description: |-
    提供基礎法力{Mana}。將|冰之勇者-琪露諾|專屬卡牌加入卡池。
    在戰鬥開始時，{PlayerName}獲得{Value1}層|大妖精的祝福|和{Value1}層|自然生長|。

  FlavorText: |-
    大妖精在清晨的花園中精心編織的花環，每一片花瓣都浸透著純凈的自然魔力與溫柔的祝福。它不僅是友誼的見證，更將大妖精「默默支持」的心意，悄然編織成了琪露諾前進的力量。
    「因為琪露諾總是沖在最前面嘛……這個花環，能讓大家的關心也追上你的腳步。把我的這份祝福也悄悄加進去，一定會讓戰鬥來得更輕松些的！」
    