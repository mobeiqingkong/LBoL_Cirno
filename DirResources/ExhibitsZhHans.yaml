CirnoRCharacterExhibitA:
  Name: 冰霜之心
  Description: |-
    提供基础法力{Mana}。将|冰之勇者-琪露诺|专属卡牌加入卡池。
    每场战斗的第一个回合开始时，获得{Value1}层|极度霜寒|。
  FlavorText: |-
    雾之湖的冰晶自然凝结成的心脏形态，是冰之勇者与故乡羁绊的象征。其中蕴含着湖底不化的寒意，让琪露诺的冻结之力如潮汐般循环不息。
    「有本最强妖精守护，雾之湖就不会被欺负！这块冰心里装着整个湖的冬天，坏蛋来多少就冻住多少！……喂，你感动得发抖了吗？绝对不是因为这颗心太冷了！」

CirnoRCharacterExhibitB:
  Name: 大妖精的祝福花环
  Description: |-
    提供基础法力{Mana}。将|冰之勇者-琪露诺|专属卡牌加入卡池。
    在战斗开始时，{PlayerName}获得{Value1}层|大妖精的祝福|和{Value1}层|自然生长|。

  FlavorText: |-
    大妖精在清晨的花园中精心编织的花环，每一片花瓣都浸透着纯净的自然魔力与温柔的祝福。它不仅是友谊的见证，更将大妖精“默默支持”的心意，悄然编织成了琪露诺前进的力量。
    「因为琪露诺总是冲在最前面嘛……这个花环，能让大家的关心也追上你的脚步。把我的这份祝福也悄悄加进去，一定会让战斗来得更轻松些的！」

CirnoRCharacterExhibitC:
  Name: 大妖精的发带
  Description: |-
    提供基础法力{Mana}。将|冰之勇者-琪露诺|专属卡牌加入卡池。
    在战斗开始时，{PlayerName}获得{Value1}层|大妖精的祝福|和{Value1}层|自然生长|。

  FlavorText: |-
    大妖精唯一留下的物品。琪露诺将它紧紧系在手腕，仿佛这样就能维系住那段突然中断的日常。发带上残留的自然的魔力，已成为她在陌生世界中寻找归途、亦是寻回挚友的唯一路标。
    「我的冰，可是最强的！所以我‘一定要找到大酱’的这份心意，也是最强的！就用这份力量，把挡路的家伙全部揍飞，然后带你回家！」
    