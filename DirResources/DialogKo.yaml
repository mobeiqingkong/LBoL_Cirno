  Kaguya:
    - "어렵지 않다고? 그건 무한한 인내를 한 가지 일에 쏟는 거야."
    - "내게 무한은 없어. 오늘과 내일뿐이야."
    - "그럼 서둘러야 해. 그건 좋은 일이지."
    - "계속 서두르고 있어."
  Mokou:
    - "영리하네. 옮겨 붙어도 난 몰라."
    - "불은 아름다워. 그런데 나는 급해."
    - "그냥 남아 있어."
  Yukari:
    - "어머, 들켰네. 네 몸의 그 틈, 골짜기 안개보다 선명해."
    - "그럼 열 수 있어? 나를 돌려보내 줘."
    - "열 수 있어. 그런데 공짜로는 안 해."
  Satori:
    - "……너무 시끄러워. 네 마음이 같은 말을 반복해."
    - "알아. 나도 질렸어."
    - "『빨리』. 수백 번 말했어. 그렇게 급히 어디로?"
    - "집. 거기서 내가 데리러 오길 기다리는 사람이 있어."
    - "……그럼 막은 건 내 잘못이네."
  Miko:
    - "도리를 모르는 자가 오히려 가장 드물지."
    - "그럼 막지 마. 드문 놈이 되게 해 줘."
    - "……네 마음이 갖고 싶어. 도리보다 재미있어."
    - "내 마음은 싸구려야. 얼음과, 한 사람뿐이야."
  Kogasa:
    - "거짓말! 방금 움찔했잖아!"
    - "그건 추워서야. 나는 얼음으로 만들어졌어."
    - "……또 그런 얼버무리는 말투."
    - "진짜야. 무서운 게 있다면, 못 돌아가는 것뿐이야."
  Mystia:
    - "밤길을 급히? 밤에 걷는 놈은 멀리 못 가."
    - "지름길은 안 가. 똑바로 갈 거야."
    - "노래 한 곡 듣고 가. 장어구이 한 그릇 값으로."
    - "돈은 없어. 얼음은 있어. 줄까?"
  Tewi:
    - "한 번? 생각보다 정직하네."
    - "우리 쪽에도 토끼가 있어. 수법은 똑같아."
    - "어? 그 녀석에게도 푹 속았어?"
    - "……어떻게 알았어."
  Reisen:
    - "토끼 열차는 오래전에 끊겼어. 어디서 탔어?"
    - "안 탔어. 다른 세계에서 떨어졌어."
    - "……그럼 그 표는 아마 무효일 텐데."
    - "그럼 걸어갈게. 더 멀리도 걸었어."
  Patchouli:
    - "……좋은 질문이네. 못 얼려. 그런데 불을 때는 사람은 얼려."
    - "결국 얼린다는 거네. 기억할게."
    - "너는 어느 책에서 나왔어? 나는 너를 쓴 적 없는데."
    - "책 속 사람이 아니야. 문을 잘못 든 사람이야."
  Suika:
    - "어? 너, 재미있는 요정이네."
    - "우리 쪽에도 네가 있어. 그쪽은 술을 덜 마셔."
    - "그럼 가르쳐 줘야겠네. 진짜 스이카가 누군지."
    - "해 보자. 나는 급해."
  Parsee:
    - "향수병? 그건 질투보다 못생겼어."
    - "못생겨도 괜찮아. 예뻐질 생각은 없어."
    - "……집에서 기다리는 사람이 있어?"
    - "있어. 그래서 여기 서 있는 거야."
  Nazrin:
    - "도구? 그럼 제대로 찾아왔네. 계약금부터."
    - "돈은 없어. 대신 적을 얼려 줄게."
    - "……거래 성사. 단, 향 하나 태우는 동안만."
    - "충분해. 나도 직접 찾을 수 있어."
  Shinmyoumaru:
    - "기다린다고? 나는 스스로 기어 나온 쪽이야."
    - "……그럼 내 공주님도 스스로 나올 수 있겠네."
    - "꼭 그렇진 않아. 밖에서 열어야 하는 문도 있어."
    - "그럼 내가 밖에서 열어서 보여 줄게."
  Hatate:
    - "집에 가져간다고? 네 집이 어디야?"
    - "멀어. 여기 지도에는 없는 곳이야."
    - "그럼 특종이잖아! 두 장 더 찍어!"
    - "마음껏 찍어. 내가 원하는 건 길이야, 사진이 아니야."
  Hina:
    - "전부 나한테 준다고? 배짱 좋네."
    - "나는 이미 충분히 불운해. 조금 더 늘어도 나빠지진 않아."
    - "……그 말, 듣고 있으니 마음이 아프네. 자, 토해 내."
    - "됐어. 그냥 들고 갈게."
  Medicine:
    - "얼려서 뭐 해. 어차피 썩어."
    - "더 늦게 썩어. 시간이 필요해."
    - "시간…… 시간을 써서 뭘 하려고?"
    - "문이 열리는 곳까지 걸어가."
  Keine:
    - "너는 내 역사에 없어. 한 페이지도."
    - "그것도 이상한 일 아니야. 밖에서 떨어졌으니까."
    - "……밖? 너 대체 몇 년도에서 온 거야?"
    - "몰라. 나는 아홉까지만 셀 수 있어."
  Kagerou:
    - "달은 길을 비추지 않아. 무는 것만 비춰."
    - "그럼 달이 없는 쪽 반을 걸을게."
    - "……너는 잘도 정리하네."
    - "정리 못 할 때는 고개 숙이고 걸어."
  Sumireko:
    - "다른 세계…… 너, 여기 사람이 아니라는 거야?"
    - "응. 떨어졌는데 아직 돌아갈 문을 못 찾았어."
    - "그럼 내 방법을 써 볼래? ……나는 꿈으로 왔지만."
    - "꿈은 해 봤어. 깨어도 같은 자리였어."
    - "아. 그건 곤란하네."
  Rumia:
    - "어둠을 얼렸다고? 어떻게."
    - "얼음은 빛을 반사해. 얼음이 있으면 빛도 있어."
    - "……그럼 그 어둠도 집에 데려갈 수 있어?"
    - "내가 데려갈 사람은 한 명뿐이야."
  Rinnosuke:
    - "집에 가는 도구…… 그런 건 팔면 안 되는 물건이야."
    - "왜?"
    - "두 번째를 사는 사람이 없으니까. 쓰면 가 버리지."
    - "그럼 내가 그 한 번을 사지."
  Sanyue:
    - "불공평? 우리 셋은 늘 같이 싸워 왔어."
    - "그럼 나도 얼음을 셋으로 나눌게."
    - "하하, 얼음이 분신한다고?"
    - "돼. 그쪽에서 해 봤어."
  Satono:
    - "너도 짝이 있어? 그 사람은 어디 있어?"
    - "아주 멀리서 기다려. 그래서 서둘러."
    - "……그건 내가 비켜야 한다는 뜻이네."
    - "비켜 주면 나도 좋아."
  Mai:
    - "설녀? 나는 그런 게 아니야."
    - "이쪽의 너는 그래. ……아마도."
    - "왜 다른 데서 온 사람처럼 말해?"
    - "정말 다른 데서 왔으니까."
  Mike:
    - "정신이 드는 게 좋은 거야! 한 방에 오니도 깨."
    - "그럼 북으로 길을 만들어 줄 수 있어?"
    - "길은 안 돼. 리듬은 돼."
    - "그럼 걸으면서 들을게."
  Kosuzu:
    - "집에 가는 법…… 이 책에도 저 책에도 없네."
    - "없으면 됐어. 내가 걸어서 만들 거야."
    - "그럼 내가 적어 둘게. 언젠가 누가 읽겠지."
    - "적어. 제목은 『최강의 요정』으로."
  Narumi:
    - "한 번만? 이건 비싼 거야."
    - "공주님이 하면 예쁠 것 같아서."
    - "……공주님, 아까부터 말하는데 누구야?"
    - "내가 데려갈 사람. 그뿐이야."
  Miyoi:
    - "따뜻한 거? 있어. 그런데 돈은 받아."
    - "돈은 없어. 대신 술 한 병 얼려 줄게."
    - "……얼린 술은 아무도 안 마셔."
    - "그럼 내가 직접 가야지."
  Xing:
    - "길? 우리는 하늘의 길밖에 몰라."
    - "그 하늘에 다른 세계로 통하는 길이 있어?"
    - "있어. 하지만 떨어진 자는 아무도 안 돌아왔어."
    - "그럼 내가 첫 번째가 될게."
  Yachie:
    - "지나가는 길? 이 길은 이제 내 관할이야."
    - "그럼 돌아갈게."
    - "돌아가? 어떻게 왔는지도 모르면서."
    - "……내가 모르는 걸 어떻게 알아."
  Jyoon:
    - "안 휘어진다고? 그럼 부순다."
    - "부숴도 얼음이야. 사방이 내 얼음이지."
    - "……너, 머리 구조가 좀 다르네."
    - "그쪽 사람들도 다 그렇게 말해."
  Hecatia:
    - "오? 이세계에서 온 손님. 내가 보내 줄 수 있는 걸 어떻게 알았지?"
    - "몰라. 만나는 사람마다 물어보고 있어."
    - "……몇 번째야?"
    - "셀 수 없어. 나는 아홉까지만 셀 수 있어."
    - "하! 그럼 한마디 주지: 길은 남의 손에 있지 않아, 자기 발밑에 있어."
  Takane:
    - "문? 얼마나 크게, 어디로 통하게?"
    - "어디로 통하는지는 몰라. 그냥 내 집이야."
    - "……좌표 없는 문은 못 만들어."
    - "그럼 좌표부터 찾을게."
  Yorihime:
    - "……나는 여동생을 잃은 적 없어."
    - "그럼 다르게 말할게. 누가 데려갔다면 어떻게 할 거야?"
    - "어떻게든 데려올 거야."
    - "그럼 나와 같네. 막지 마."
  Toyohime:
    - "길이라…… 월도에는 다리가 있어. 하지만 네가 말한 곳엔 안 닿아."
    - "그럼 다리 끝까지 걸어가서, 나머지는 내가 놓을게."
    - "의지가 좋네. 자, 복숭아 하나 더 줄게."
    - "……고마워. 가는 길에 반씩."
  Siji:
    - "심판받을지 아닌지는 내가 정해. 너는 뭘 했지?"
    - "그냥 장소를 잘못 들었어."
    - "장소를 잘못 든 건 죄가 아니야. 그런데 너는 한 페이지가 비어 있어."
    - "……그 페이지는 내 세계에 두고 왔어."
  Yiji:
    - "속았다고? 내가 너를 속인 적 있어?"
    - "없어. 그런데 그쪽 토끼에게는 여러 번 속았어."
    - "……그럼 다른 토끼에게 질 수 없지."
    - "너희 둘은 정말 같은 모델이야."
  DreamServants:
    - "（말없이 꿈을 짜기 시작한다）"
    - "……또 이 꿈이야. 벌써 여러 번 꿨는데."
    - "（꿈속의 문이 하나씩 닫힌다）"
    - "닫아. 깨어나면 내가 직접 걸을게."
  Long:
    - "……나는 용이야. 토끼가 아니야."
    - "그런데 토끼 냄새가 나."
    - "그건 열차 냄새야. 너도 탔어?"
    - "아니. 나는 떨어졌어."
  Ringo:
    - "잠깐, 아직 준다고 안 했어."
    - "이미 손에 들고 있잖아. 그건 주는 거야."
    - "……너, 참 제멋대로인 요정이네."
    - "원래 그래."
  Shion:
    - "미움받았네…… 그래도 익숙해."
    - "미워하는 게 아니야. 나눌 두 번째 불운이 없을 뿐이야."
    - "……그건 사실이네. 내 건 이미 가득해."
    - "그래서 빨리 가야 해. 아니면 나한테 나눠질 테니까."
  Eternity:
    - "경계? 들어 봤어. 그런데 다음 날엔 잊어버려."
    - "……그럼 아무것도 못 얻겠네."
    - "그래도 하나는 기억해. 저쪽에서 누가 떨어져 내린 적이 있어."
    - "누구?!"
    - "잊었어."
  Budu:
    - "보내줄지 아닐지는 나 혼자 정할 수 없어."
    - "그럼 한 명씩 물어볼게."
    - "……너, 참 귀찮은 녀석이네."
    - "기다리는 사람이 있어. 귀찮아도 괜찮아."
  Seija:
    - "집에 가는 길? 뒤집어 보면, 너에겐 길이 아예 없어."
    - "있어. 너희가 막고 있을 뿐이야."
    - "막는다고? 나는 『위』와 『아래』를 바꿨을 뿐이야."
    - "그럼 내가 다시 바꿔 놓을게."
    - "하. 다른 세계에서 떨어진 요정이 무슨 자격으로?"
    - "돌아가야 하니까."

Defeat:
  Reimu: "이쪽의 너는 좋은 사람이야. 기억할게."
  Marisa: "그쪽의 너는 이렇게 약하지 않았어."
  Sakuya: "내가 이겼어. 그럼 도망갈게."
  Alice: "네 마법은 다정해. 그쪽과 똑같아."
  Cirno: ["내가 이겼어. 그럼…… 내가 나보다 강한 거야?", "아니야. 내가 운이 좋았을 뿐이야."]
  Koishi: "너는 나를 막을 이유가 없었잖아."
  Aya: "사진 잘 찍어. 공주님도 볼 거야."
  Clownpiece: "불쌍하지 않아. 돌아갈 곳이 있으니까."
  Doremy: "적어도 이번엔 내가 너를 깨우는 쪽이야."
  Junko: "내 길은 멈출 수 없어."
  Kokoro: "웃었네. 그거면 됐어."
  Luna: "드디어 조용해졌네. 나는 갈게."
  Nitori: "졌으니 한 대 공짜로 만들어. 그렇게 정했어."
  Remilia: "오백 년 흡혈귀도 급한 놈은 못 막아."
  Rin: "주운 건 다 제자리에 돌려놨어. 나도 가야지."
  Sanae: "동향끼리 싸워서 좀 미안하네."
  Star: "돌아가면 너 이야기도 공주님에게 할게."
  Sunny: "빛나면 녹아. 그래도 내가 이겼어."
  SuwakoLimao: "안 얼린다고 했지. 이번엔 진짜 안 얼렸어."
  KanakoLimao: "바람이 멈췄어. 내 차례야."
  Tianzi: "복숭아는 내 거야. 돌아가서 공주님과 반씩."
  Youmu: "아슬아슬했지만, 내가 이겼어."
  Yuyuko: "먹힐 뻔했어. 진짜 무서웠어."
  LightFairy: "빛 좀 빌려 줘. 길을 확인해야겠어."
  Eirin: "약은 안 마셔. 깨어 있는 채로 집에 갈 거야."
  Kaguya: "죽지 않는 자도 지는구나. 그럼 나는 따라잡을 수 있어."
  Mokou: "불은 세네. 아쉽지만 얼음이 더 차가워."
  Yukari: "졌으니 길 하나 돌려줘. 약속이야."
  Satori: "읽지 마. 나는 그냥 집에 가고 싶을 뿐이야."
  Miko: "도리는 몰라. 나는 앞으로 걸어갈 뿐이야."
  Kogasa: "놀란 건 네 쪽이야. 거꾸로지."
  Mystia: "노래 좋았어. 그런데 잠들 수 없어."
  Tewi: "또 세 번 속았어. 그래도 내가 이겼어."
  Reisen: "열차는 언제 출발해? 서서 가도 괜찮아."
