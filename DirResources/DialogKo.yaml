    - "……그쪽의 나는 참 대단한 녀석이네. 여기서는 아무것도 안 했어."
    - "알아. 그래서 계속 손을 안 댔어. 그런데 왔으니 한 판 붙자."
  Marisa:
    - "어, 치르노? 비슷한데. 너를 본 기억은 없는데."
    - "너는 나를 몰라. 나는 다른 세계에서 떨어졌어."
    - "다른 세계? 세계가 또 있어? 너무 수상한데."
    - "나도 그렇게 생각해. 그래도 안 비켜 주면, 네 마포를 시험해 볼게."
  Sakuya:
    - "급해? 아가씨의 연회 전에는 아무도 못 나가."
    - "나가는 게 아니야. 집에 가는 거야."
    - "……집. 그 이유는 많이 들어 봤어. 못 보내."
  Alice:
    - "그쪽? 나를 만난 적 있는 것처럼 말하네."
    - "만났어. 그런데 그쪽 너는 이렇게 안 웃어."
    - "……안 웃을 때는 대개 바느질을 하고 있어."
  Cirno:
    - "야, 누구야. 왜 내 모습이야?"
    - "내가 물어볼 차례야. 너, 이쪽의 나야?"
    - "이쪽? 무슨 소리야."
    - "됐어. 이긴 쪽이 최강의 나야."
  Koishi:
    - "어? 진짜 못 읽네. 네 머릿속이 텅 비었어. 밖 같아."
    - "나는 밖에서 왔어. 읽을 필요 없어. 내가 말할게."
    - "밖 사람들은 말이 참 많네. 밖의 실력을 시험해 보자."

