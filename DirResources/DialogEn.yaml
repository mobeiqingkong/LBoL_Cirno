GenericMeet:
  Fairy: ["A fairy? Just as loud as the ones back home.", "Out of the way. Someone is waiting for me.", "Smaller than me, but braver."]
  Rabbit: ["Another rabbit. I will not fall for it.", "Rabbits that block the road get frozen too.", "I memorized the tricks. Which page was it?"]
  Doll: ["A doll blocking the road? I will freeze it into an ornament.", "Nicely made. Too bad it will not step aside.", "It would be cute if it did not move."]
  Mask: ["Masked ones are the most suspicious. Freeze the mask first.", "A fox mask... you lot again.", "Does not matter who is behind it."]
  Tiangou: ["Tengu are fast. But ice is slippery.", "Flying around, are you? Freezing fixes that.", "Fast is fast. You still have to land."]
  Wolf: ["A wolf? My ice beats your fangs.", "Howl all you like, you cannot stop me.", "Sharp teeth. Ice is harder."]
  Ghost: ["A ghost? I-I am not scared!", "Floating around makes you hard to aim at.", "Do not pop out from behind!"]
  Fox: ["A fox! I counted the traps.", "Nice tail. But I am in a hurry."]
  Bat: ["Pitch black. Looks better frozen.", "Fly as wild as you like. Not as wild as my ice."]
  Raven: ["A raven? We have those back home.", "A black bird over a frozen lake. Nice."]
  Drone: ["It flies by itself? Then carry a letter for me.", "A kappa invention. Does it explode?"]
  Girl: ["A girl? I am strong, you know.", "Do not look at me like that. I am not here to play."]
  Yinyang: ["A yin-yang orb? Freeze it and it rolls away.", "Freeze it and it stops spinning. Simple."]
