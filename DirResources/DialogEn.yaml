Defeat:
  Reimu: "The you here is a good person. I will remember that."
  Marisa: "The you back home was not this easy to beat."
  Sakuya: "I won. Time to run."
  Alice: "Your magic is gentle. Just like hers."
  Cirno: ["I won. So does that mean... I am stronger than me?", "No. I just got lucky."]
  Koishi: "You never really had a reason to stop me."
  Aya: "Make the photo look good. The princess will see it."
  Clownpiece: "I am not pitiful. I have somewhere to go back to."
  Doremy: "At least this time, I am the one waking you."
  Junko: "My road cannot stop."
  Kokoro: "You smiled. That is good enough."
  Luna: "Quiet at last. I am going."
  Nitori: "You lost, so build me one for free. Settled."
  Remilia: "Five hundred years of vampire cannot stop someone in a hurry."
  Rin: "Everything is back where it was. I should go too."
