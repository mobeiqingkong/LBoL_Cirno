  Brief: |-
    {PlayerName}のターン終了時、層数が1減少し、全ての敵に|自然消亡|を付与する。

CirnoRCharacterFairyFeatherSe:
  Name: 妖精之羽
  Description: |-
    {PlayerName}が緑のカードを使用するたび、ランダムな敵に{Value1}層の|自然消亡|を付与する。
  Brief: |-
    {PlayerName}が緑のカードを使用するたび、ランダムな敵に|自然消亡|を付与する。

CirnoRCharacterFairyFlowerSe:
