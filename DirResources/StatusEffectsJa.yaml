  Description: |-
    {OwnerName}のターン終了時、ライフ最大値の3%を失う。
  Brief: |-
    {OwnerName}のターン終了時、ライフ最大値の3%を失う。

CirnoRCharacterIceSoulSe:
  Name: 氷魄
  Description: |-
    青いカードを使用するたび、{blockValue}点の|ブロック|を得る。
    敵に|霜凍|を付与するたび、{shieldValue}点の|バリア|を得る。
  Brief: |-
    青いカードを使用するたび、|ブロック|を得る。
    敵に|霜凍|を付与するたび、|バリア|を得る。

CirnoRCharacterFrostbiteSe:
