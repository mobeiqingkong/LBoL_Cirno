  Description: |-
    青いカードを使用するたび、カードを1枚引く。緑のカードを使用するたび、<sprite="ManaSprite" name="P">を得る。（引いたカード数と得たマナ数は合計{limitValue}回まで、残り{leftValue}回）。ターン終了時にこの効果は解除される。
  Brief: |-
    青いカードを使用するたび、カードを1枚引く。緑のカードを使用するたび、<sprite="ManaSprite" name="P">を得る。（引いたカード数と得たマナ数は合計{limitValue}回まで、残り{leftValue}回）。ターン終了時にこの効果は解除される。

