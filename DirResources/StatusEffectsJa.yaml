    {SourceCardName}が追加ダメージを与える。

CirnoRCharacterForceOfNatureSe:
  Name: 自然之声
  Description: |-
    {PlayerName}のターン開始時、{Level}点の{Mana}を得る。
  Brief: |-
    {PlayerName}のターン開始時、{Level}点の{Mana}を得る。

