  Description: |-
    自身のターン開始時、{loseHpValue}点のライフを失い、{firepowerValue}点の|火力|を得る。
  Brief: |-
    自身のターン開始時、ライフを失い、|火力|を得る。

CirnoRCharacterFrozenSe:
