    {OwnerName}のターン開始時、30%の確率で行動不能になる。その後、この効果は取り除かれる。
  Brief: |-
    {OwnerName}のターン開始時、30%の確率で行動不能になる。その後、この効果は取り除かれる。

CirnoRCharacterMuggleWandSe:
