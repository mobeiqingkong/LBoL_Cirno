CirnoRCharacterFrostEtchingImprintSe:
  Name: 極度霜寒
  Description: 青いカードを使用後、ランダムな敵に|霜凍|を{Value1}回付与する。
  Brief: 青いカードを使用後、ランダムな敵に|霜凍|を{Value1}回付与する。

CirnoRCharacterFrostflowSe:
  Name: 氷脈
  Description: 各ターン開始時、{PlayerName}は{CirnoRCharacterFrostValue}層の|凝霜|を得る。
  Brief: 各ターン開始時、{PlayerName}は{CirnoRCharacterFrostValue}層の|凝霜|を得る。

CirnoRCharacterFrostCondensationSe:
  Name: 凝霜
  Description: |-
    敵にダメージを与えるたび、層数が1減少し、対象の敵に|霜凍|を付与する。
  Brief: |-
    敵にダメージを与えるたび、層数が1減少し、対象の敵に|霜凍|を付与する。

CirnoRCharacterFrostSe:
  Name: 霜凍
  Description: |-
    {OwnerName}のターン開始時、{TempFirepowerNegativeValue}点の|臨時火力ダウン|を得て、|霜凍|が解除される。
    再度|霜凍|効果を受けた時、{BaseDamage}点のダメージを受け、|凍傷|が付与される。
  Brief: |-
    {OwnerName}のターン開始時、|臨時火力ダウン|を得て、|霜凍|が解除される。
    再度|霜凍|効果を受けた時、ダメージを受け、|凍傷|が付与される。

CirnoRCharacterFrozenHexagramSe:
  Name: 六芒星氷晶
  Description: 青いカードを使用後、{PlayerName}は{TempFirepowerValue}層の|臨時火力|と{ShieldValue}層の|バリア|を得る。各ターン終了時に層数が1減少する。
  Brief: 青いカードを使用後、{PlayerName}は|臨時火力|と|バリア|を得る。各ターン終了時に層数が1減少する。

CirnoRCharacterFrozenHexagramShieldSe:
  Name: 氷結六芒星盾
  Description: |-
    {PlayerName}のターン終了時、{ShieldValue}点の|バリア|を得て、{PlayerName}に{LockedOnValue}層の|ロックオン|を追加する。
  Brief: |-
    {PlayerName}のターン終了時、|バリア|を得て、{PlayerName}に|ロックオン|を追加する。

CirnoRCharacterNaturalGrowthSe:
  Name: 自然生長
  Description: |-
    {Value1}点の{Mana}を使用するごとに、手札に|妖精之花|を1枚追加する。
  Brief: |-
    {Value1}点の{Mana}を使用するごとに、手札に|妖精之花|を1枚追加する。

CirnoRCharacterElfFlowerFieldSe:
  Name: 盛夏花開
  Description: |-
    {PlayerName}のターン開始時、{Mana}を得る。
    {PlayerName}のターン開始時、手札に{TempCirnoRCharacterFairyFlowerValue}枚の|妖精之花|を追加する。
  Brief: |-
    {PlayerName}のターン開始時、{Mana}を得る。
    {PlayerName}のターン開始時、手札に|妖精之花|を追加する。

CirnoRCharacterDaiyouseiBlessSe:
  Name: 大妖精の祝福
  Description: |-
    {PlayerName}が緑のカードを使用するたび、{TempFirepowerValue}層の|臨時火力|を得る。
  Brief: |-
    {PlayerName}が緑のカードを使用するたび、|臨時火力|を得る。

CirnoRCharacterGuardianOfDaiyouseiSe:
  Name: 大妖精の守護
  Description: |-
    {PlayerName}のターン終了時、{TempCirnoRCharacterGuardianOfNatureSeValue}層の|自然庇護|を得る。
  Brief: |-
    {PlayerName}のターン終了時、|自然庇護|を得る。

CirnoRCharacterGuardianOfNatureSe:
  Name: 自然庇護
  Description: |-
    敵からのダメージを受けるたび、層数が1減少し、ダメージ源に{Value1}層の|自然消亡|を付与する。
  Brief: |-
    敵からのダメージを受けるたび、層数が1減少し、ダメージ源に|自然消亡|を付与する。

CirnoRCharacterDeathOfNatureSe:
  Name: 自然消亡
  Description: |-
    この印を持つキャラクターは、自身のターン終了時または{PlayerName}が治癒を行う時、{loseHpValue}点のライフを失う。敵が|凍傷|を持っている場合、さらに{loseHpValueForFrost}点のライフを失う。
    |自然消亡|は解除できない。
  Brief: |-
    この印を持つキャラクターは、自身のターン終了時または{PlayerName}が治癒を行う時、ライフを失う。敵が|凍傷|を持っている場合、さらにライフを失う。
    |自然消亡|は解除できない。

CirnoRCharacterEntangledRootsSe:
  Name: 根須纏繞
  Description: |-
    {Level}ターン行動不能。
  Brief: |-
    {Level}ターン行動不能。

