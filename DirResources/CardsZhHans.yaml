  Description: 获得 {Value1} 层|风神助推|。
  FlavorText: "来自文文的祝福"

CirnoRCharacterWither:
  Name: 凋零
  Description: |-
    |每支付|<sprite="ManaSprite" name="G">：对所有敌人施加 {Value1} 层|自然消亡|。
    |每支付|{Mana}：触发所有敌人的|自然消亡|一次。
  UpgradedDescription: |-
    对所有敌人施加 {Value1} 层|自然消亡|。
    |每支付|<sprite="ManaSprite" name="G">：对所有敌人施加 {Value1} 层|自然消亡|。
    |每支付|{Mana}：触发所有敌人的|自然消亡|一次。
  FlavorText: "鲜花终会凋零。"

CirnoRCharacterTheHiddenBiosphere:
  Name: 被隐藏的生物圈
  Description: |-
    {PlayerName}的回合结束时，触发所有敌人的|自然消亡|。
  FlavorText: "湖底一直在响。有人以为是水声。咱知道不是。"

CirnoRCharacterFireworksFestival:
  Name: 烟花大会
  Description: 从 {Value1} 张随机的防御牌中选择一张加入手中，它|暂塑|为{Mana}。
  FlavorText: "锵锵～！烟花大会开始啦！"

CirnoRCharacterIceTears:
  Name: 冰泪
  Description: 获得一层|冰泪|。
  FlavorText: "“下雨了”“没啊…”“不！下雨了”"

CirnoRCharacterFreezeBloodIntoIce:
  Name: 凝血成冰
  Description: |-
    {PlayerName}的回合开始时，失去 {Value1} 点生命，获得 {Value1} 点|火力|。
  UpgradedDescription: |-
    获得 {Value1} 点|火力|。
    {PlayerName}的回合开始时，失去 {Value1} 点生命，获得 {Value1} 点|火力|。
  FlavorText: "这是我最后的波纹了。"

CirnoRCharacterEncounterRain:
  Name: 冻雨
  Description: |-
    获得 {Value1} 层|冰脉| 和 {Value2} 层|冻雨|。
  FlavorText: "出门记得带伞~"

CirnoRCharacterIceBead:
  Name: 冰霜射线
  Description: |-
    造成 {Damage} 点伤害。
    施加|霜冻|。
    本回合内每打出一张蓝色牌，{SelfName}伤害增加 {Value2} 点。
    如果敌人具有|自然消亡|，额外造成 {Value3} 点伤害。
  FlavorText: "滋————滋————滋————啊？能量不够了？"

CirnoRCharacterBloodShield:
  Name: 化血成盾
  Description: |-
    |抉择|：失去 {Value1} 点生命，获得 {Value2} 点|护盾|；或失去 {Value3} 点生命，获得 {Value4} 点|护盾|。
  ExtraDescription1: 失去 {Value1} 点生命，获得 {Value2} 点|护盾|。
  ExtraDescription2: 失去 {Value3} 点生命，获得 {Value4} 点|护盾|。
  FlavorText: "咱可是连血都能变成冰的哦！普通的妖精才做不到呢！啊？有点儿疼。"

CirnoRCharacterFairyTeaParty:
  Name: 妖精的茶会
  Description: |-
    本回合内，每打出一张蓝色牌，抽 {Value1} 张牌；每打出一张绿色牌，获得{Mana}。
    抽牌数和获得法力数累计不超过 {Value2} 次。
    打出卡牌后|放逐|手牌、抽牌堆和弃牌堆中所有{SelfName}。
  FlavorText: "点心来喽~点心来喽~"

CirnoRCharacterDreamCirno:
  Name: 魔法天才-琪露诺
  Description: |-
    |抉择|：将 {Value1} 张|魔法手雷|加入弃牌堆；或将 {Value1} 张|麻瓜魔杖|加入弃牌堆。
  ExtraDescription1: 将 {Value1} 张|魔法手雷|加入弃牌堆。
  ExtraDescription2: 将 {Value1} 张|麻瓜魔杖|加入弃牌堆。
  UpgradedDescription: 将 {Value1} 张|魔法手雷|和 {Value1} 张|麻瓜魔杖|加入弃牌堆。
  FlavorText: "锵锵～！天才的魔法表演时间！"

CirnoRCharacterMagicGrenade:
  Name: 魔法手雷
  Description: |-
    对所有敌人造成 {Damage} 点伤害。
    施加|魔法余波|。
  FlavorText: "Fire The Hole!"

CirnoRCharacterMuggleWand:
  Name: 麻瓜魔杖
  Description: |-
    造成 {Damage} 点伤害 {Value1} 次。
    施加|枪伤|。
  FlavorText: "这玩意可比魔杖好使多了"

CirnoRCharacterIceSoul:
  Name: 冰魄
  Description: |-
    每次使用蓝色牌，获得 {Value1} 点|格挡|。
    每次施加|霜冻|时，获得 {Value2} 点|护盾|。
  FlavorText: "那是孤独的雪，是死掉的雨，是雨的精魂。"

CirnoRCharacterSymbioticRoot:
  Name: 共栖根络​
  Description: |-
    {PlayerName} 每次失去生命时, 如果伤害来源于敌人，触发敌人的|自然消亡|。
  FlavorText: "咱要把挨的打还回去。"

CirnoRCharacterAFragranceWithinReach:
  Name: 咫尺芳香
  Description: |-
    获得 {Block} 点|格挡|。
    本场战斗每打出一张|妖精之花|，额外获得 {Value2} 点|格挡|。
  FlavorText: "呼哧呼哧——呼哧呼哧——大酱好香呀。"

CirnoRCharacterTheCounterattackBegins:
  Name: 反击开始
  Description: |-
    对所有敌人造成 {Damage} 点伤害。
    每有一个敌人具有|自然消亡|, 额外造成一次伤害。
  FlavorText: "现在，咱要认真了！"

CirnoRCharacterWalkingInTheRain:
  Name: 雨中漫步
  Description: |-
    获得 {Block} 点格挡。
    本回合中，每当你打出一张绿色牌，获得 {Value2} 点格挡。
  FlavorText: "于暴雨中行走，伞是倒划天空的船。"
