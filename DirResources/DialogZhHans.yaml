    - "为什么？"
    - "因为没人会买第二次。用过就走了。"
    - "那咱就买这一次。"
  Sanyue:
    - "不公平？我们三个从来都是一起上的。"
    - "那咱也把冰分成三份。"
    - "哈哈，你以为冰块还能分身？"
    - "能。咱那边试过。"
  Satono:
    - "你也有搭档？那她人呢？"
    - "在很远的地方等咱。所以咱要快。"
    - "……听起来，我该让开才对。"
    - "咱也希望你让开。"
  Mai:
    - "雪女？我可不是那种东西。"
    - "那咱这边的你是。……大概吧。"
    - "你说话怎么像从别处来的？"
    - "因为咱就是从别处来的。"
  Mike:
    - "提神就对了！我这一敲，鬼都醒。"
    - "那能不能敲出一条路来？"
    - "路不行。节奏可以。"
    - "那咱边走边听。"
  Kosuzu:
    - "回家……这本、那本，好像都没有。"
    - "没有就算了。咱自己走出一条来。"
    - "那我把它记下来。将来会有人看的。"
    - "记吧。标题写『最强的妖精』。"
  Narumi:
    - "看一眼？这条可是很贵的。"
    - "咱只是觉得，公主戴上会好看。"
    - "……你一直在说公主。她是谁？"
    - "咱要接回家的人。就这样。"
  Miyoi:
    - "热的？有啊。但得付钱。"
    - "咱没钱。咱给你冻一壶酒当钱。"
    - "……冻的酒可没人喝。"
    - "那咱只好自己走了。"
  Xing:
    - "认路？我们只认天上那几条。"
    - "那天上有没有一条，通向别的世界？"
    - "有。但掉进去的，没见谁回来过。"
    - "那咱就当第一个。"
  Yachie:
    - "路过？这条路现在归我管。"
    - "那咱就绕过去。"
    - "绕？你连自己怎么来的都不知道，还想绕。"
    - "……你怎么知道咱不知道。"
  Jyoon:
    - "掰不弯？那我就把它砸碎。"
    - "砸碎了也是冰。满地都是咱的冰。"
    - "……你这妖精，脑子有点不一样。"
    - "咱那边的大家都这么说。"
  Hecatia:
    - "哦？异世界来的小客人。你怎么知道我能送？"
    - "咱不知道。咱只是见到谁都问一遍。"
    - "……问到第几个了？"
    - "咱数不清了。咱只会数到九。"
    - "哈！那送你一句：路不在别人手上，在自己脚下。"
  Takane:
    - "门？你要多大？通向哪儿？"
    - "不知道通向哪儿。就是咱家。"
    - "……没有坐标的门，我造不出来。"
    - "那咱就先把坐标找出来。"
  Yorihime:
    - "……我没有丢过妹妹。"
    - "那咱换个说法。要是她被人带走了，你会怎么做？"
    - "我会把她带回来。用任何方法。"
    - "那咱俩一样。所以别拦咱。"
  Toyohime:
    - "路啊……月都有桥。但桥不通到你说的那种地方。"
    - "那咱就走桥走到头，再自己搭。"
    - "真有干劲。喏，再给你一个桃子。"
    - "……谢了。路上分一半。"
  Siji:
    - "该不该，由我说了算。你做了什么？"
    - "咱只是走错了地方。"
    - "走错地方不算罪。但你身上缺了一页。"
    - "……那一页，留在咱自己的世界了。"
  Yiji:
    - "上当？你被我骗过吗？"
    - "没有。但咱那边的兔子，骗过咱好多次。"
    - "……那我可不能输给别的兔子。"
    - "你俩确实一个样式。"
  DreamServants:
    - "（无声地开始编织梦境）"
    - "……又是这种梦。咱已经做过好几遍了。"
    - "（梦里的门，一扇一扇地关上）"
    - "关吧。咱醒了就自己走。"
  Long:
    - "……我是龙。不是兔子。"
    - "可你身上有兔子的味道。"
    - "那是列车上的味道。你也上过车？"
    - "没有。咱是掉进来的。"
  Ringo:
    - "等等，我还没说要给你。"
    - "你已经拿在手上了。那就是要给的。"
    - "……你这妖精，怎么这么会自作主张。"
    - "咱一直都是这样。"
  Shion:
    - "被嫌弃了……不过我也习惯了。"
    - "咱不嫌弃你。咱只是没有第二份倒霉可以分。"
    - "……那倒是真的。我这份已经够满了。"
    - "所以咱得赶紧走。不然就匀给咱了。"
  Eternity:
    - "境界？听过。但我隔天就忘了。"
    - "……那咱也问不出什么了。"
    - "不过我还记得一件事：有人从那边掉下来过。"
    - "谁？！"
    - "忘了。"
  Budu:
    - "让不让，不是我一个人说了算。"
    - "那咱就一个一个问过去。"
    - "……你还真是麻烦的家伙。"
    - "有人等咱。麻烦一点也无所谓。"
  Seija:
    - "回家的路？我倒过来看，你根本就没有路。"
    - "咱有。只是被你们这种人挡住了。"
    - "挡住？我只是把『上面』和『下面』换了个位置而已。"
    - "那咱就把位置再换回去。"
    - "呵。一个从别的世界掉下来的妖精，凭什么？"
    - "凭咱非回去不可。"

Defeat:
  Reimu: "这边的你，是好人。咱记住了。"
  Marisa: "那边的你可没这么好打。"
  Sakuya: "咱赢了。先跑路喽。"
  Alice: "你的魔法很温柔。跟那边一样。"
  Cirno: ["咱赢了。那就是说……咱比咱强？", "不对。咱的运气真好。"]
  Koishi: "你其实没有拦咱的理由。"
  Aya: "照片拍好看点。公主也会看。"
  Clownpiece: "咱才不可怜。咱有要回去的地方。"
  Doremy: "至少这次，是咱叫醒你。"
  Junko: "咱的路不能停。"
  Kokoro: "你笑出来了。这样就好。"
  Luna: "总算安静了。咱走了。"
  Nitori: "输了就免费给咱造一台。就这样定了。"
  Remilia: "五百年的吸血鬼，也拦不住一个赶路的。"
  Rin: "东西都放回原处了。咱也该走了。"
  Sanae: "同乡打同乡，有点过意不去。"
  Star: "回去以后，把你也讲给公主听。"
  Sunny: "亮了就化。可咱还是赢了。"
  SuwakoLimao: "咱说了不冻了。这次真的没冻。"
  KanakoLimao: "风停了。该咱说话了。"
  Tianzi: "桃子归咱。回去分公主一半。"
  Youmu: "好不容易，咱赢了。"
  Yuyuko: "差点被吃掉。吓死咱了。"
  LightFairy: "借咱一点光。咱要看清楚路。"
  Eirin: "药咱还是不喝。咱要清醒着回家。"
  Kaguya: "不死的人也会输。那咱一定能赶上。"
  Mokou: "火很旺。可惜冰更冷。"
  Yukari: "输了就还咱一条路。说话算话。"
  Satori: "别看了。咱只想回家。"
  Miko: "咱不懂道理。咱只会往前走。"
  Kogasa: "是你吓到咱了。反过来才对。"
  Mystia: "歌很好听。可咱不能睡。"
  Tewi: "又被骗了三次。可咱还是赢了。"
  Reisen: "列车什么时候开？站票也行。"
  Patchouli: "原来火真的冻不住。那咱就把人冻住。"
  Suika: "小的小，重的重，冰的冰。"
  Parsee: "嫉妒让人变弱。想家让人变强。"
  Nazrin: "没找到是吧。那咱自己去找。"
  Shinmyoumaru: "长大一点，咱再跟你打一场。"
  Hatate: "头条给你。咱要回家了。"
  Hina: "厄运转走了。后面的路应该会顺一点。"
  Medicine: "毒冻住了。没有人受伤。"
  Keine: "你不知道，那咱就自己走。"
  Kagerou: "月亮还在。方向也还在。"
  Sumireko: "下次见面，咱请你喝茶。"
  Rumia: "黑暗冻住了，也会反光。"
  Rinnosuke: "没有道具。那咱自己想办法。"
  Sanyue: "三个人也没拦住咱。下一个。"
  Satono: "咱这份冰，是两个人的量。"
  Mai: "雪和冰本来就是一家。"
  Mike: "这鼓声，咱会记很久。"
  Kosuzu: "谢谢你给咱一本书。"
  Narumi: "缎带你留着。公主会给咱新的。"
  Miyoi: "下次来，给咱留一杯热的。"
  Xing: "星星落了。咱的路呢？"
  Yachie: "咱不站队。咱只是要回家。"
  Jyoon: "力气大，也掰不弯冰。"
  Hecatia: "连女神都拦不住咱。那咱一定回得去。"
  Takane: "门没造出来。那咱自己找路。"
  Yorihime: "你懂的吧。咱不能留在这里。"
  Toyohime: "桃子很甜。可咱想回家吃饭。"
  Siji: "审判还没到。咱还有事要做。"
  Yiji: "第四只兔子了。这次咱赢。"
  DreamServants: "梦要醒了。咱一定要在家。"
  Long: "输给兔子三次。这回总算赢了。"
  Ringo: "团子留着。给公主尝一口。"
  Shion: "厄运没沾上。谢谢你。"
  Eternity: "没有答案。那咱继续找。"
  Budu: "你让开了。谢谢你。"
  Seija: "倒过来的，咱正回去就好了。"

GenericMeet:
  Fairy: ["妖精吗？跟咱家那边一样吵。", "别挡路。有人在等咱。", "个子比咱小，胆子比咱大。"]
  Rabbit: ["又一只兔子。咱不会上当啦。", "兔子挡路也要冻住。", "骗术咱背过。第几页来着？"]
  Doll: ["人偶也拦路？冻成摆件好啦。", "做得精致。可惜不会让路。", "不动的话挺可爱的。"]
  Mask: ["戴面具的最可疑。先冻面具。", "狐狸假面……又是你们。", "面具后是谁都一样。"]
  Tiangou: ["天狗好快。可冰面很滑。", "飞来飞去的，冻住就行。", "快是快。总得落地吧。"]
  Wolf: ["狼？咱的冰比牙厉害。", "嚎得再响也拦不住咱。", "牙很尖。冰更硬。"]
  Ghost: ["幽灵？咱、咱才不怕！", "飘来飘去，很难瞄准。", "别从背后冒出来！"]
  Fox: ["狐狸！陷阱咱数过了。", "尾巴好看。可咱在赶路。"]
  Bat: ["黑漆漆的。冻住好看点。", "飞得再乱，也乱不过咱的冰。"]
  Raven: ["乌鸦？咱那边也有。", "黑鸟飞过冰湖。好看。"]
  Drone: ["会自己飞？帮咱送个信吧。", "河童的发明。会炸吗？"]
  Girl: ["女孩子？咱可是很强的。", "别那样看咱。咱不是来玩的。"]
  Yinyang: ["阴阳玉？一冻就滚走了。", "冻住就不转了。简单。"]
  # 穿越相关：走到哪儿都在找同一样东西
  Boundary: ["境界的碎片？咱认得这个味道。", "哪儿有能开门的道具？"]

GenericMeetFallback:
  - "挡路的都要冻住！"
  - "别拦咱。咱赶时间。"
  - "这连热身都不算。"
  - "让开。有人在等咱。"
  - "咱是从别的世界掉下来的。这话咱说过几遍了？"
  - "这儿的路，咱一条都不认识。"

GenericDefeatFallback:
  - "解决。继续赶路。"
  - "下一个也一起上吧。"
  - "公主，再等等咱。"
  - "冰之勇者，大获全胜！"

Ending:
  WithGenerator:
    - "门开了。"
    - "公主——咱来接你回家了。"
  WithoutGenerator:
    - "门不在这儿。"
    - "那咱就再走一圈。总会走到的。"
