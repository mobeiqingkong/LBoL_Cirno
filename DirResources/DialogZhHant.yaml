    - "月亮不照路。月亮只照着咬人的東西。"
    - "那咱就走沒有月亮的那一半。"
    - "……你倒是想得開。"
    - "咱想不開的時候，就低頭走路。"
  Sumireko:
    - "別的世界……你是說，你不是這裏的人？"
    - "嗯。咱掉進來的，還沒找到回去的門。"
    - "那你可以試試我的方法。……不過我那是做夢過來的。"
    - "做夢咱試過了。醒了還在原地。"
    - "哎。那確實麻煩。"
  Rumia:
    - "你把黑暗凍住了？怎麼可能。"
    - "冰會反光。有冰就有光。"
    - "……那你能不能把黑暗也帶回家？"
    - "咱只想帶一個人回家。"
  Rinnosuke:
    - "回家的道具……這種東西，本來就不該有賣。"
    - "爲什麼？"
    - "因爲沒人會買第二次。用過就走了。"
    - "那咱就買這一次。"
  Sanyue:
    - "不公平？我們三個從來都是一起上的。"
    - "那咱也把冰分成三份。"
    - "哈哈，你以爲冰塊還能分身？"
    - "能。咱那邊試過。"
  Satono:
    - "你也有搭檔？那她人呢？"
    - "在很遠的地方等咱。所以咱要快。"
    - "……聽起來，我該讓開纔對。"
    - "咱也希望你讓開。"
  Mai:
    - "雪女？我可不是那種東西。"
    - "那咱這邊的你是。……大概吧。"
    - "你說話怎麼像從別處來的？"
    - "因爲咱就是從別處來的。"
  Mike:
    - "提神就對了！我這一敲，鬼都醒。"
    - "那能不能敲出一條路來？"
    - "路不行。節奏可以。"
    - "那咱邊走邊聽。"
  Kosuzu:
    - "回家……這本、那本，好像都沒有。"
    - "沒有就算了。咱自己走出一條來。"
    - "那我把它記下來。將來會有人看的。"
    - "記吧。標題寫『最強的妖精』。"
  Narumi:
    - "看一眼？這條可是很貴的。"
    - "咱只是覺得，公主戴上會好看。"
    - "……你一直在說公主。她是誰？"
    - "咱要接回家的人。就這樣。"
  Miyoi:
    - "熱的？有啊。但得付錢。"
    - "咱沒錢。咱給你凍一壺酒當錢。"
    - "……凍的酒可沒人喝。"
    - "那咱只好自己走了。"
  Xing:
    - "認路？我們只認天上那幾條。"
    - "那天上有沒有一條，通向別的世界？"
    - "有。但掉進去的，沒見誰回來過。"
    - "那咱就當第一個。"
  Yachie:
    - "路過？這條路現在歸我管。"
    - "那咱就繞過去。"
    - "繞？你連自己怎麼來的都不知道，還想繞。"
    - "……你怎麼知道咱不知道。"
  Jyoon:
    - "掰不彎？那我就把它砸碎。"
    - "砸碎了也是冰。滿地都是咱的冰。"
    - "……你這妖精，腦子有點不一樣。"
    - "咱那邊的大家都這麼說。"
  Hecatia:
    - "哦？異世界來的小客人。你怎麼知道我能送？"
    - "咱不知道。咱只是見到誰都問一遍。"
    - "……問到第幾個了？"
    - "咱數不清了。咱只會數到九。"
    - "哈！那送你一句：路不在別人手上，在自己腳下。"
  Takane:
    - "門？你要多大？通向哪兒？"
    - "不知道通向哪兒。就是咱家。"
    - "……沒有座標的門，我造不出來。"
    - "那咱就先把座標找出來。"
  Yorihime:
    - "……我沒有丟過妹妹。"
    - "那咱換個說法。要是她被人帶走了，你會怎麼做？"
    - "我會把她帶回來。用任何方法。"
    - "那咱倆一樣。所以別攔咱。"
  Toyohime:
    - "路啊……月都有橋。但橋不通到你說的那種地方。"
    - "那咱就走橋走到頭，再自己搭。"
    - "真有幹勁。喏，再給你一個桃子。"
    - "……謝了。路上分一半。"
  Siji:
    - "該不該，由我說了算。你做了什麼？"
    - "咱只是走錯了地方。"
    - "走錯地方不算罪。但你身上缺了一頁。"
    - "……那一頁，留在咱自己的世界了。"
  Yiji:
    - "上當？你被我騙過嗎？"
    - "沒有。但咱那邊的兔子，騙過咱好多次。"
    - "……那我可不能輸給別的兔子。"
    - "你倆確實一個樣式。"
  DreamServants:
    - "（無聲地開始編織夢境）"
    - "……又是這種夢。咱已經做過好幾遍了。"
    - "（夢裏的門，一扇一扇地關上）"
    - "關吧。咱醒了就自己走。"
  Long:
    - "……我是龍。不是兔子。"
    - "可你身上有兔子的味道。"
    - "那是列車上的味道。你也上過車？"
    - "沒有。咱是掉進來的。"
  Ringo:
    - "等等，我還沒說要給你。"
    - "你已經拿在手上了。那就是要給的。"
    - "……你這妖精，怎麼這麼會自作主張。"
    - "咱一直都是這樣。"
  Shion:
    - "被嫌棄了……不過我也習慣了。"
    - "咱不嫌棄你。咱只是沒有第二份倒黴可以分。"
    - "……那倒是真的。我這份已經夠滿了。"
    - "所以咱得趕緊走。不然就勻給咱了。"
  Eternity:
    - "境界？聽過。但我隔天就忘了。"
    - "……那咱也問不出什麼了。"
    - "不過我還記得一件事：有人從那邊掉下來過。"
    - "誰？！"
    - "忘了。"
  Budu:
    - "讓不讓，不是我一個人說了算。"
    - "那咱就一個一個問過去。"
    - "……你還真是麻煩的傢伙。"
    - "有人等咱。麻煩一點也無所謂。"
  Seija:
    - "回家的路？我倒過來看，你根本就沒有路。"
    - "咱有。只是被你們這種人擋住了。"
    - "擋住？我只是把『上面』和『下面』換了個位置而已。"
    - "那咱就把位置再換回去。"
    - "呵。一個從別的世界掉下來的妖精，憑什麼？"
    - "憑咱非回去不可。"

