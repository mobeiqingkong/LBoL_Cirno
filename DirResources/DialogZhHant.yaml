GenericMeet:
  Fairy: ["妖精嗎？跟咱家那邊一樣吵。", "別擋路。有人在等咱。", "個子比咱小，膽子比咱大。"]
  Rabbit: ["又一隻兔子。咱不會上當啦。", "兔子擋路也要凍住。", "騙術咱背過。第幾頁來着？"]
  Doll: ["人偶也攔路？凍成擺件好啦。", "做得精緻。可惜不會讓路。", "不動的話挺可愛的。"]
  Mask: ["戴面具的最可疑。先凍面具。", "狐狸假面……又是你們。", "面具後是誰都一樣。"]
  Tiangou: ["天狗好快。可冰面很滑。", "飛來飛去的，凍住就行。", "快是快。總得落地吧。"]
  Wolf: ["狼？咱的冰比牙厲害。", "嚎得再響也攔不住咱。", "牙很尖。冰更硬。"]
  Ghost: ["幽靈？咱、咱纔不怕！", "飄來飄去，很難瞄準。", "別從背後冒出來！"]
  Fox: ["狐狸！陷阱咱數過了。", "尾巴好看。可咱在趕路。"]
  Bat: ["黑漆漆的。凍住好看點。", "飛得再亂，也亂不過咱的冰。"]
  Raven: ["烏鴉？咱那邊也有。", "黑鳥飛過冰湖。好看。"]
  Drone: ["會自己飛？幫咱送個信吧。", "河童的發明。會炸嗎？"]
  Girl: ["女孩子？咱可是很強的。", "別那樣看咱。咱不是來玩的。"]
  Yinyang: ["陰陽玉？一凍就滾走了。", "凍住就不轉了。簡單。"]
  # 穿越相關：走到哪兒都在找同一樣東西
  Boundary: ["境界的碎片？咱認得這個味道。", "哪兒有能開門的道具？"]

