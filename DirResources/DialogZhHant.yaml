# 琪露諾R —— 臺詞表（繁體）
#
# 直接編輯本文件即可，【不需要重新編譯】；改完重啓遊戲就生效。
# （讀取器會比對文件修改時間，改了會自動重讀，連重啓都可以省。）
#
# 缺哪個鍵就自動回落到 DialogZhHans.yaml 的同名鍵，所以可以只翻譯一部分。
#
# ===== 鍵名分組 =====
#   Meet                  進入戰鬥時琪露諾的開場白（key = 敵人的 C# 類名，如 Reimu / Seija）
#   Reply                 與敵人的【交替對白】，緊跟開場白
#   Defeat                擊敗該角色後琪露諾說的話
#   GenericMeet           雜兵兜底：按關鍵詞匹配敵人 Id，在候選裏隨機取一條
#   GenericMeetFallback   完全沒有匹配上時用的開場白
#   GenericDefeatFallback 兜底擊敗語
#   Ending                擊敗最終 BOSS 正邪時的分流臺詞
#
# ===== ★ Reply 是交替的，誰在第幾句說話必須數清楚 =====
#   Reply 的第 1 句由【敵人】說，之後 琪露諾 → 敵人 → 琪露諾 → …
#   即：偶數下標（0/2/4）＝敵人說，奇數下標（1/3/5）＝琪露諾說。寫反了就串臺詞。
#   寫成單行字符串 = 只有 1 句（那 1 句由敵人說）。
#
# ===== 寫作規矩 =====
#   · 一句一行，儘量不超過 34 個字（氣泡寬度有限）。
#     Meet 1~2 句；Reply 2~6 句；Defeat 1 句。臺詞多的角色別超過 7 句，
#     否則開局對白會太長（驅動側有 11 秒上限，超了會按比例壓縮、句子會變趕）。
#   · 第一人稱「咱」；救人對象一律叫「公主」，不點名（日語あたい / 韓語나 / 英語 I）。
#   · 「勇者」只允許出現在原作三句式裏（自稱題名 / 反駁「笨蛋勇者」/ 勝利口號）。
#   · 不要出現 { } | < >（會被遊戲的格式化與富文本邏輯喫掉）。
#   · 引號一律用「」『』，不要用 ASCII 雙引號（會把 YAML 字符串截斷）。
#
# ===== 本 mod 的設定（寫臺詞前先讀）=====
#   琪露諾是**穿越者**：她誤打誤撞、連原因都沒弄明白，就從《東方冰之勇者記》的世界線
#   掉進了這個世界（幻想鄉的另一條世界）。她要找【境界感知儀】才能開門回家，
#   而在她的世界線裏，這些人大多也存在 —— 只是經歷、立場、甚至善惡都不一樣
#   （最要命的是：她那邊的靈夢是把她公主關進大祭壇的「夢魘巫女」，這邊的靈夢卻什麼都沒幹過）。
#   所以對白裏可以出現「咱那邊的你」「你不是咱認識的那個」「這兒的你不是這樣」這類對照，
#   但別每場都重複同一個句式 —— 換個角度說（認錯人 / 氣味不對 / 你不屬於這兒 / 謝謝這邊你）。
# =====

