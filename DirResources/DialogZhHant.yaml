  Alice: "你的魔法很溫柔。跟那邊一樣。"
  Cirno: ["咱贏了。那就是說……咱比咱強？", "不對。咱的運氣真好。"]
  Koishi: "你其實沒有攔咱的理由。"
  Aya: "照片拍好看點。公主也會看。"
  Clownpiece: "咱纔不可憐。咱有要回去的地方。"
  Doremy: "至少這次，是咱叫醒你。"
  Junko: "咱的路不能停。"
  Kokoro: "你笑出來了。這樣就好。"
  Luna: "總算安靜了。咱走了。"
  Nitori: "輸了就免費給咱造一臺。就這樣定了。"
  Remilia: "五百年的吸血鬼，也攔不住一個趕路的。"
