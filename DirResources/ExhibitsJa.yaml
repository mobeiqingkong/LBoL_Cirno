CirnoRCharacterExhibitA:
  Name: 氷霜の心
  Description: "{Mana}を提供する。|氷の勇者-チルノ|専用カードをカードプールに加える。\n各戦闘の最初のターン開始時、|極度の霜寒|を{Value1}得る。"
  FlavorText: "霧の湖の氷晶が自然に凝結して心の形となったものは、氷の勇者と故郷の絆の象徴である。その中には湖底の溶けない寒気が込められており、チルノの凍結の力を潮の満ち干のように循環させ続ける。\n「最強の妖精が守ってやるよ、霧の湖はもういじめられない！この氷の心には湖全体の冬が詰まってるんだから、悪党が何人来ても凍りつかせてやる！……ねえ、感動で震えてるの？絶対にこの心が冷たすぎるからじゃないよ！」"

CirnoRCharacterExhibitB:
  Name: 大妖精の祝福の花輪
  Description: "{Mana}を提供する。|氷の勇者-チルノ|専用カードをカードプールに加える。\n戦闘開始時、{PlayerName}は|大妖精の祝福|を{Value1}と|自然成長|を{Value1}得る。"
  FlavorText: "大妖精が朝の庭で心を込めて編んだ花輪で、一枚一枚の花弁には純粋な自然の魔力と優しい祝福が浸みこんでいる。それは友情の証であるだけでなく、大妖精の「黙って支える」という想いを、チルノの進む力にそっと織り込んだものである。\n「だってチルノはいつも一番前に飛び出して行くから……この花輪で、みんなの気持ちも君に追いつけるように。私のこの祝福もこっそり加えておいたら、きっと戦いがもっと楽になるはず！」"