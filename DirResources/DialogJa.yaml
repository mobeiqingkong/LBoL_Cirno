GenericMeet:
  Fairy: ["妖精か？あたいのとこも同じくらいうるさい。", "邪魔をするな。待ってる人がいる。", "背はあたいより低いが、度胸は上だ。"]
  Rabbit: ["また兎か。もう騙されないぞ。", "兎でも道を塞ぐなら凍らせる。", "手口は覚えた。何頁目だっけ？"]
  Doll: ["人形まで道を塞ぐ？飾りに凍らせてやる。", "よくできてる。でもどかないな。", "動かなければ可愛いのに。"]
  Mask: ["面をかぶってるのが一番怪しい。まず面を凍らせる。", "狐の面……またあんたらか。", "面の後ろが誰でも同じだ。"]
