  Sumireko:
    - "別の世界……あんた、ここの人間じゃないってこと？"
    - "そうだ。落ちてきて、まだ帰り口を見つけてない。"
    - "なら私の方法を試す？……私は夢で来たんだけど。"
    - "夢は試した。起きたら同じ場所だった。"
    - "あー。それは厄介ね。"
  Rumia:
    - "闇を凍らせた？そんなの、どうやって。"
    - "氷は光を返す。氷があれば光がある。"
    - "……ならその闇も、家に持って帰れる？"
    - "あたいが連れて帰るのは、一人だけだ。"
  Rinnosuke:
    - "帰る道具……あんなもの、売ってはいけないんだよ。"
    - "なぜだ？"
    - "二度目を買う者がいないからね。使ったら、もう行ってしまう。"
    - "ならあたいが、その一度を買う。"
  Sanyue:
    - "不公平？私たちはいつも三人で戦ってきた。"
    - "ならあたいも氷を三等分する。"
    - "はは、氷が分身できるとでも？"
    - "できる。あっちで試した。"
  Satono:
    - "あんたにも相棒がいるのか？その人はどこだ。"
    - "ずっと遠くで待ってる。だから急ぐ。"
    - "……それは、私がどくべきということか。"
    - "どいてくれるなら、あたいも嬉しい。"
  Mai:
    - "雪女？私はそんなものじゃないよ。"
    - "こっちのあんたは、そうだ。……たぶん。"
    - "どうしてよそ者みたいな話し方をする？"
    - "あたいは、本当によそ者だから。"
  Mike:
    - "目が覚めるのがいいんだよ！一発で鬼も起きる。"
    - "なら道を叩き出せるか？"
    - "道は無理だ。リズムなら。"
    - "なら歩きながら聞く。"
  Kosuzu:
    - "帰り方……この本にも、あの本にも、載ってないなあ。"
    - "ないならいい。自分で歩いて作る。"
    - "じゃあ私が書き残しておく。いつか誰かが読む。"
    - "書けよ。見出しは『最強の妖精』だ。"
  Narumi:
    - "一目だけ？これ、高いんだよ。"
    - "姫さまがつけたら、きれいだと思って。"
    - "……姫さまって、さっきから言ってるけど、誰？"
    - "あたいが連れて帰る人。それだけだ。"
  Miyoi:
    - "温かいの？あるよ。でも金はもらう。"
    - "金はない。代わりに酒を一壺、凍らせてやる。"
    - "……凍った酒は誰も飲まないよ。"
    - "なら自分で行くしかない。"
  Xing:
    - "道？私たちは空の道しか知らない。"
    - "その空に、別の世界へ通じる道はあるか？"
    - "ある。でも落ちた者は、誰も戻ってこない。"
    - "ならあたいが最初になる。"
  Yachie:
    - "通りすがり？この道は今、私の管轄だ。"
    - "なら迂回する。"
    - "迂回？自分がどう来たかも知らないで。"
    - "……あたいが知らないと、なぜわかる。"
  Jyoon:
    - "曲がらない？なら砕く。"
    - "砕いても氷だ。辺り一面、あたいの氷だ。"
    - "……あんた、頭の作りが違うな。"
    - "あっちの皆もそう言う。"
  Hecatia:
    - "ほう？異世界からの小さな客よ。なぜ私が送れると？"
    - "知らない。会った者に片っ端から聞いてる。"
    - "……何人目だ？"
    - "数えきれない。あたいは九までしか数えられない。"
    - "はは！なら一言やろう：道は誰かの手の中じゃない、自分の足の下だ。"
  Takane:
    - "扉？どのくらいの大きさで、どこに通す？"
    - "どこに通るかは知らない。あたいの家だ。"
    - "……座標のない扉は、作れないな。"
    - "なら先に座標を探す。"
  Yorihime:
    - "……私は妹をなくしたことはない。"
    - "なら言い方を変える。もし連れ去られたら、どうする？"
    - "何としても、連れ戻す。"
    - "ならあたいと同じだ。邪魔をするな。"
  Toyohime:
    - "道ねえ……月都には橋があるわ。でもあんたの言う場所には通じない。"
    - "なら橋の端まで歩いて、あとは自分で架ける。"
    - "たいした意気込みね。ほら、もう一つ桃をあげる。"
    - "……ありがとう。道中で半分こ。"
  Siji:
    - "裁かれるべきかは私が決める。あんたは何をした？"
    - "ただ場所を間違えただけだ。"
    - "場所違いは罪じゃない。だが、あんたは一頁欠けている。"
    - "……その一頁は、自分の世界に置いてきた。"
  Yiji:
    - "騙す？私があんたを騙したことがあるか？"
    - "ない。でもあっちの兎には何度も騙された。"
    - "……なら他の兎には負けられないな。"
    - "あんたらは本当に同じ型だ。"
  DreamServants:
    - "（無言で夢を紡ぎ始める）"
    - "……またこの夢か。もう何度も見た。"
    - "（夢の中の扉が、次々と閉じていく）"
    - "閉じろ。目が覚めたら自分で歩く。"
  Long:
    - "……私は龍だ。兎ではない。"
    - "でも兎のにおいがする。"
    - "それは列車のにおいだ。あんたも乗ったのか？"
    - "ない。あたいは落ちてきた。"
  Ringo:
    - "待って、まだあげるとは言ってないよ。"
    - "もう手に持ってる。それは、あげるということだ。"
    - "……あんた、ずいぶん勝手な妖精だな。"
    - "ずっとこうだ。"
  Shion:
    - "嫌われた……でも慣れてる。"
    - "嫌ってない。あたいには分ける二つ目の不運がないだけだ。"
    - "……それは本当ね。私のはもう満杯だわ。"
    - "だから急いで行く。でないと、あたいに分けられる。"
  Eternity:
    - "境界？聞いたことある。でも翌日には忘れる。"
    - "……なら何も聞き出せないな。"
    - "でも一つだけ覚えてる。あっちから誰かが落ちてきたことがある。"
    - "誰だ！？"
    - "忘れた。"
  Budu:
    - "通すかどうかは、私一人では決められない。"
    - "なら一人ずつ聞いていく。"
    - "……あんた、面倒な奴だな。"
    - "待ってる人がいる。面倒でも構わない。"
  Seija:
    - "帰り道？逆さにして見れば、あんたに道などない。"
    - "ある。あんたらが塞いでるだけだ。"
    - "塞ぐ？私は『上』と『下』を入れ替えただけだ。"
    - "ならあたいが元に戻す。"
    - "はっ。別の世界から落ちた妖精が、何の権利で？"
    - "帰らなければならないからだ。"

