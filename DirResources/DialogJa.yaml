# 琪露诺R —— 台词表（日本語）
#
# 直接编辑本文件即可，【不需要重新编译】；改完重启游戏就生效。
# （读取器会比对文件修改时间，改了会自动重读，连重启都可以省。）
#
# 缺哪个键就自动回落到 DialogZhHans.yaml 的同名键，所以可以只翻译一部分。
#
# ===== 键名分组 =====
#   Meet                  进入战斗时琪露诺的开场白（key = 敌人的 C# 类名，如 Reimu / Seija）
#   Reply                 与敌人的【交替对白】，紧跟开场白
#   Defeat                击败该角色后琪露诺说的话
#   GenericMeet           杂兵兜底：按关键词匹配敌人 Id，在候选里随机取一条
#   GenericMeetFallback   完全没有匹配上时用的开场白
#   GenericDefeatFallback 兜底击败语
#   Ending                击败最终 BOSS 正邪时的分流台词
#
# ===== ★ Reply 是交替的，谁在第几句说话必须数清楚 =====
#   Reply 的第 1 句由【敌人】说，之后 琪露诺 → 敌人 → 琪露诺 → …
#   即：偶数下标（0/2/4）＝敌人说，奇数下标（1/3/5）＝琪露诺说。写反了就串台词。
#   写成单行字符串 = 只有 1 句（那 1 句由敌人说）。
#
# ===== 写作规矩 =====
#   · 一句一行，尽量不超过 34 个字（气泡宽度有限）。
#     Meet 1~2 句；Reply 2~6 句；Defeat 1 句。台词多的角色别超过 7 句，
#     否则开局对白会太长（驱动侧有 11 秒上限，超了会按比例压缩、句子会变赶）。
#   · 第一人称「咱」；救人对象一律叫「公主」，不点名（日语あたい / 韩语나 / 英语 I）。
#   · 「勇者」只允许出现在原作三句式里（自称题名 / 反驳「笨蛋勇者」/ 胜利口号）。
#   · 不要出现 { } | < >（会被游戏的格式化与富文本逻辑吃掉）。
#   · 引号一律用「」『』，不要用 ASCII 双引号（会把 YAML 字符串截断）。
#
# ===== 本 mod 的设定（写台词前先读）=====
#   琪露诺是**穿越者**：她误打误撞、连原因都没弄明白，就从《东方冰之勇者记》的世界线
#   掉进了这个世界（幻想乡的另一条世界）。她要找【境界感知仪】才能开门回家，
#   而在她的世界线里，这些人大多也存在 —— 只是经历、立场、甚至善恶都不一样
#   （最要命的是：她那边的灵梦是把她公主关进大祭坛的「梦魇巫女」，这边的灵梦却什么都没干过）。
#   所以对白里可以出现「咱那边的你」「你不是咱认识的那个」「这儿的你不是这样」这类对照，
#   但别每场都重复同一个句式 —— 换个角度说（认错人 / 气味不对 / 你不属于这儿 / 谢谢这边你）。
# =====
#
# --- 日本語メモ ---
#   一人称：あたい。連れて帰る相手：姫さま。氷の勇者＝氷の勇者チルノ。
#   【境界感知器】/ 大祭壇 / 悪夢の巫女 —— mod 説明文と同じ語を使う。
#   中国語の作品ネタは**日本語の原典**を使う（「迷えば、敗ける」など）。引用符は「」『』のみ。

Meet:
  # ---- 対戦相手になりうるキャラ ----
  Reimu: ["赤白の巫女——またこの顔か。", "違う。あんたはあたいの知ってるあんたじゃない。"]
  Marisa: "星の魔法使い。あたいのとこにもいる。"
  Sakuya: "時は止められても、道は止められない。急いでるんだ、どいてどいて。"
  Alice: "いい人形だな。あっちのあんたもそう言う。"
  Cirno: ["あたいが二人？なら天下無敵だ！", "待て——あたいは一人のはずだ。"]
  Koishi: "読めよ。どうせあたいの心は読めないから。"

  # ---- 名前のある敵 ----
  Aya: "天狗の記者。見出しは『最強の氷の勇者』でいい。"
  Clownpiece: "旗を人の家の前に挿してるぞ。取り戻せ。"
  Doremy: "出発点に戻る夢は、もうたくさんだ。"
  Junko: ["そんなに深く憎んで……あたいにも少しわかる。", "でもあたいは憎めない。まだ連れて帰る人がいる。"]
  Kokoro: "面を替えれば表情が変わる。あたいは『最強』の一枚だけだ。"
  Luna: "なんであたいをつけてくるんだ？"
  Nitori: "なあ。境界を越える機械、作れるか？"
  Remilia: "いくつだ？あたいは九までしか数えられない。"
  Rin: "人が落としたものは、返すべきだろ。"
  Sanae: "あんたも外から来たんだろ？においでわかる。"
  Star: "きらきらしてるな。姫さまもきっと気に入る。"
  Sunny: "まぶしい！あたいの氷が溶けちゃう！"
  SuwakoLimao: "悪いってのはわかってる。でもあたいは二までしか数えられない。"
  KanakoLimao: "どんな風でも、あたいの氷は散らない。"
  Tianzi: "桃のにおいがする。姫さまが先に抱きつくぞ。"
  Youmu: "今、迷ったな。姫さまと同じだ。"
  Yuyuko: "食うな。あたいは氷でできてて、まずいんだ。"
  LightFairy: "あたいの氷は光を返すだけ。光らない。"
  Eirin: "月の頭脳。境界を破る方法を教えろ。"
  Kaguya: "死なないなら、誰かを待つのは難しくないんだろ。"
  Mokou: "いい火だ。あたいは三歩下がる。"
  Yukari: ["とぼけるな。あたいがどう来たか、見てたんだろ。", "あの裂け目、あんたが残したのか？"]
  Satori: "心を読むな。中は全部同じものだ。"
  Miko: "大層な道理はわからない。ただ連れて帰りたいだけだ。"
  Kogasa: "驚いてない。さっきは合わせてやったんだ。"
  Mystia: "いい歌だ。でもあたいは急いでる。"
  Tewi: "もう騙すな。一度引っかかったんだから。"
  Reisen: "兎の列車に、まだ温かいものはあるか？"
  Patchouli: "魔女のお姉さん。火は凍らせられないよな？"
  Suika: "小さいは小さい、重いは重い、氷は氷。"
  Parsee: "妬んでない。ただ家が恋しいだけだ。"
  Nazrin: "光ってて、扉を開ける道具、見たことあるか？"
  Shinmyoumaru: "小さな姫さま。あんたも誰かに助けに来てほしいんだろ。"
  Hatate: "写真、二枚撮れるか？一枚は家に持って帰る。"
  Hina: "厄は全部あたいによこせ。怖くない。"
  Medicine: "あたいの氷は毒を閉じ込める。散らない。"
  Keine: "歴史の先生。あたいのこの道、間違ってるか？"
  Kagerou: "月が丸い。帰り道を照らしてくれたらな。"
  Sumireko: "あんたも別の世界から？同郷だ！"
  Rumia: "真っ暗だ。あたいの氷について来い。道が見える。"
  Rinnosuke: "人を家に帰す道具はあるか？氷なら払える。"
  Sanyue: "三人がかりか。ちょっと不公平だろ。"
  Satono: "あんたらはいつも一緒だな。あたいと姫さまもだ。"
  Mai: "雪女？この世界にも雪があるのか。"
  Mike: "太鼓はうるさい。でも目が覚める。"
  Kosuzu: "どの本に帰り方が書いてある？"
  Narumi: "そのリボン、ちょっと見せてくれればいい。"
  Miyoi: "温かいものはあるか？指が凍ってる。"
  Xing: "星でできた妖怪。道はわかるだろ。"
  Yachie: "あたいは組しない。通りすがりだ。"
  Jyoon: "力が強くても、氷は曲がらない。"
  Hecatia: "頼む。あたいを自分の世界に返してくれ。"
  Takane: "あたいの家に通じる扉、作れるか？"
  Yorihime: "妹を一人なくしたことがあるなら、わかるだろ。"
  Toyohime: "桃はあたいに一つ残してくれ。欲しいのは道だ。"
  Siji: "まだ裁かれる時じゃない。"
  Yiji: "また兎か。もう騙されないぞ。"
  DreamServants: "これは夢か？起きたら家にいるのか？"
  Long: "兎か龍か？あたいは数えられる。二つだ。"
  Ringo: "団子はもらう。道中で半分姫さまに。"
  Shion: "貧乏神は近づくな。あたいはもう十分不運だ。"
  Eternity: "妖精は物覚えが悪い。で、境界のことは知ってるか？"
  Budu: "戦いたくないなら、通してくれ。"
  Seija: "あたいの帰り道を返せ。"

Reply:
  # ---- 対戦相手になりうるキャラ ----
  Reimu:
    - "入ってくるなり睨みつけて。何かしたか？"
    - "あっちのあんたが、姫さまを大祭壇に閉じ込めた。"
    - "……あっちのあたいは、なかなかの奴だな。ここでは何もしてないぞ。"
    - "わかってる。だからずっと手を出さなかった。でも来たからには、一戦だ。"
  Marisa:
    - "よう、チルノ？似てるけど、あんたに会った覚えはないな。"
    - "あんたはあたいを知らない。あたいは別の世界から落ちてきた。"
    - "別の世界？世界が他にもある？怪しすぎるだろ。"
    - "あたいもそう思う。でもどかないなら、あんたの魔砲を試させろ。"
  Sakuya:
    - "急ぎ？お嬢様の宴の前に、誰も出られないわ。"
    - "出るんじゃない。帰るんだ。"
    - "……帰る。その理由は何度も聞いた。通せない。"
  Alice:
    - "そっち？あたいに会ったことがあるみたいに言うな。"
    - "会った。でもそのあんたは、こんなに笑わない。"
    - "……笑ってない時は、たいてい縫い物をしてる。"
  Cirno:
    - "おい、誰だ。なんであたいの姿になる。"
    - "あたいが聞きたい。あんた、こっちのあたいか？"
    - "こっち？何を言ってるんだ。"
    - "もういい。勝った方が最強のあたいだ。"
  Koishi:
    - "あれ？本当に読めない。あんたの頭、すかすかだ。外みたい。"
    - "あたいは外から来た。読まなくていい。自分で言う。"
    - "外の奴はよく喋るな。外の実力、試させろ。"

  # ---- 名前のある敵 ----
  Aya:
    - "スクープ！異世界の妖精が戦場に——コメントを！"
    - "異世界の妖精じゃない。落ちてきたんだ。"
    - "落ちてきたのもスクープだ！どうやって？"
    - "わからない。だから帰り道を探してる。"
  Clownpiece:
    - "バカ妖精じゃないか！また迷ったのか？"
    - "バカ妖精じゃない！"
    - "ははは、反応まで同じだ。どこから出てきた？"
    - "自分の世界から。ここの奴は誰も知らない。"
    - "そりゃ気の毒にな。一戦やろうぜ！"
  Doremy:
    - "おかしい。夢は私が編むのに、あんたの夢は帳簿にない。"
    - "そうだ。あたいはあんたの網の中じゃ眠らない。"
    - "……面白い。じゃあどうやって入った？"
    - "わからない。気づいたら、もうここにいた。"
    - "なら、そのまま眠り続けな。"
  Junko:
    - "何がわかる。あんたに憎む資格すらない。"
    - "憎んだことはない。ただ連れ戻したいだけだ。"
    - "連れ戻す……あんたはまだ、できるんだな。"
    - "だからあたいは止まれない。"
  Kokoro:
    - "あんたの顔についてるのは、うるさい。反響する。"
    - "……反響？わからない。"
    - "あんたの心は二重だ。一つはここ、一つは遠く。"
    - "へえ。じゃあ一つは、姫さまのためにあるんだ。"
  Luna:
    - "やっと追いついたぞ、チルノ。今度こそ負けない。"
    - "おいおいおい、人違いだって！"
  Nitori:
    - "できるけど……まず、客はどこから来た？"
    - "別の世界だ。落ちてきた奴は、自分じゃ帰れない。"
    - "わあ。この仕事は受けない。境界は別料金だ。代わりに最新の機械を試せ。"
  Remilia:
    - "五百年以上よ。来年まで数えるつもり？"
    - "……なら数えるのをやめる。"
    - "ふん。あんたの方こそ、そのにおいはこの土地のものじゃない。"
  Rin:
    - "へえ？あたしが拾うのは、誰にも要らない物ばかりだ。"
    - "扉を開ける道具を探してる。見たことあるか？"
    - "拾ったことないね。あったら売ってるよ。"
    - "なら探し続ける。"
  Sanae:
    - "どうしてわかった？待って……あんた、外界の人じゃない。"
    - "別の世界から落ちてきた。あんたよりずっと遠くから。"
    - "じゃあどうやって帰るの？"
    - "【境界感知器】があれば帰れる。今探してる。"
    - "……ならおみくじを引いてあげる。大凶。"
  Star:
    - "姫さま？それ誰？"
    - "あたいが連れて帰る人。光るものが好きだ。"
    - "なら、まずあんたが光らないと。"
    - "……あたいの氷は、光を返すだけ。"
  Sunny:
    - "溶けた方がいい！日光は強いんだぞ！"
    - "強いのはいい。でも目がくらむ。"
    - "なら目をつぶって戦えよ！"
    - "やってみる。目をつぶっても聞こえる。"
  SuwakoLimao:
    - "カエルを凍らせた件、覚えてるよ。"
    - "もう凍らせない。今は敵だけだ。"
    - "……説得力が足りないな。"
    - "なら手で証明する。"
  KanakoLimao:
    - "大口だ。ではやってみせろ。"
  Tianzi:
    - "桃？天界にいくらでもある。いる？"
    - "いらない。あたいが欲しいのは道だ。"
    - "道か……あんたにその実力があるかどうかだ。"
  Youmu:
    - "迷ってなどいない。剣士は迷ってはならない。迷えば、敗ける。"
    - "その台詞、どこかで聞いたな。"
    - "黙れ。刀を見ろ。"
  Yuyuko:
    - "氷ねえ……かき氷にできるわね。"
    - "あたいはまずくない！本当にまずくない！"
  LightFairy:
